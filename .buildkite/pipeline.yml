steps:
  - label: ":go: Format"
    key: fmt
    command: .buildkite/setup-go.sh go fmt ./...

  - label: ":go: Vet"
    key: vet
    depends_on: fmt
    command: .buildkite/setup-go.sh go vet ./...

  - label: ":go: Test"
    key: test
    depends_on: fmt
    command: .buildkite/setup-go.sh go test ./... -count=1

  - label: ":go: Build"
    key: build
    depends_on:
      - vet
      - test
    command: .buildkite/setup-go.sh go build -ldflags="-s -w" ./cmd/builddeck

  - label: ":rocket: Release"
    key: release
    depends_on: build
    if: build.branch == "main" && build.message =~ /^release:/
    command: .buildkite/setup-go.sh go build -ldflags="-s -w -X main.version=${BUILDKITE_TAG:-dev}" ./cmd/builddeck
