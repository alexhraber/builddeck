steps:
  - label: ":broom: Tidy"
    key: tidy
    command: |
      .buildkite/setup-go.sh go mod tidy
      if ! git diff --exit-code -- go.mod go.sum; then
        echo "^^^ +++"
        echo "go.mod or go.sum is dirty — run 'go mod tidy' and commit the changes."
        exit 1
      fi
      echo "go.mod and go.sum are clean"

  - label: ":golang: Format"
    key: fmt
    depends_on: tidy
    command: .buildkite/setup-go.sh go fmt ./...

  - label: ":golang: Vet"
    key: vet
    depends_on: fmt
    command: .buildkite/setup-go.sh go vet ./...

  - label: ":female-detective: Lint"
    key: lint
    depends_on: fmt
    command: .buildkite/setup-go.sh go run github.com/golangci/golangci-lint/cmd/golangci-lint@latest run ./...

  - label: ":lock: Sec Scan"
    key: gosec
    depends_on: fmt
    command: .buildkite/setup-go.sh go run github.com/securego/gosec/v2/cmd/gosec@latest ./...

  - label: ":mag: Vuln Check"
    key: vulncheck
    depends_on: tidy
    command: .buildkite/setup-go.sh go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  - label: ":golang: Test"
    key: test
    depends_on: fmt
    command: |
      echo "--- Running tests with coverage"
      .buildkite/setup-go.sh go test ./... -count=1 -coverprofile=coverage.out -v 2>&1
      echo "All tests passed"
      buildkite-agent artifact upload coverage.out

  - label: ":chart_with_upwards_trend: Codecov"
    key: codecov
    depends_on: test
    command: |
      buildkite-agent artifact download coverage.out .
      curl -sOs https://uploader.codecov.io/latest/linux/codecov
      chmod +x codecov
      ./codecov -f coverage.out

  - label: ":tag: Tag Version"
    key: tag
    depends_on:
      - test
      - vet
      - lint
      - gosec
      - vulncheck
      - tidy
    command: |
      echo "--- Determining version"
      # Date-based version: vYYYYMMDD.buildNumber
      VERSION="v$(date +%Y%m%d).${BUILDKITE_BUILD_NUMBER}"
      echo "Version: ${VERSION}"
      echo "${VERSION}" > version.txt
      buildkite-agent artifact upload version.txt
      # Create and push tag (requires GITHUB_TOKEN with repo scope)
      git config user.email "builddeck@buildkite.com"
      git config user.name "builddeck-bot"
      git tag "${VERSION}"
      git push origin "${VERSION}"

  - label: ":golang: Build and Release"
    key: build
    depends_on: tag
    command: |
      echo "--- Checking all packages compile"
      .buildkite/setup-go.sh go build ./...
      echo "--- Building builddeck binary"
      VERSION=$(buildkite-agent artifact download version.txt . --step tag && cat version.txt)
      echo "Building version: ${VERSION}"
      .buildkite/setup-go.sh go build -ldflags="-s -w -X main.version=${VERSION}" -o builddeck ./cmd/builddeck
      ls -lh builddeck
      buildkite-agent artifact upload builddeck
      # Create GitHub release with this version
      if [[ -n "${VERSION}" ]]; then
        .buildkite/release.sh "${VERSION}"
      fi

  - label: ":lock: Checksum"
    key: checksum
    depends_on: build
    command: |
      echo "--- Downloading builddeck binary"
      buildkite-agent artifact download builddeck /tmp/
      echo "--- Generating SHA256 checksum"
      sha256sum /tmp/builddeck | tee builddeck.sha256
      buildkite-agent artifact upload builddeck.sha256