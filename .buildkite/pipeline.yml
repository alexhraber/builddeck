steps:
  - label: ":broom: Tidy"
    key: tidy
    command: |
      .buildkite/setup-go.sh go mod tidy
      if ! git diff --exit-code -- go.mod go.sum; then
        echo "^^^ +++"
        echo "go.mod or go.sum is dirty — run 'go mod tidy' and commit the changes."
        exit 1
      fi
      echo "go.mod and go.sum are clean"

  - label: ":go: Format"
    key: fmt
    depends_on: tidy
    command: .buildkite/setup-go.sh go fmt ./...

  - label: ":go: Vet"
    key: vet
    depends_on: fmt
    command: .buildkite/setup-go.sh go vet ./...

  - label: ":female-detective: Lint"
    key: lint
    depends_on: fmt
    command: .buildkite/setup-go.sh sh -c "go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest && golangci-lint run ./..."

  - label: ":lock: Sec Scan"
    key: gosec
    depends_on: fmt
    command: .buildkite/setup-go.sh sh -c "go install github.com/securego/gosec/v2/cmd/gosec@latest && gosec ./..."

  - label: ":mag: Vuln Check"
    key: vulncheck
    depends_on: tidy
    command: .buildkite/setup-go.sh sh -c "go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./..."

  - label: ":go: Test"
    key: test
    depends_on: fmt
    command: |
      echo "--- Running tests with coverage"
      .buildkite/setup-go.sh go test ./... -count=1 -coverprofile=coverage.out -v 2>&1
      echo "All tests passed"
      buildkite-agent artifact upload coverage.out

  - label: ":chart_with_upwards_trend: Codecov"
    key: codecov
    depends_on: test
    command: |
      buildkite-agent artifact download coverage.out .
      curl -sOs https://uploader.codecov.io/latest/linux/codecov
      chmod +x codecov
      ./codecov -f coverage.out

  - label: ":go: Build all packages"
    key: build-all
    depends_on:
      - vet
      - lint
      - gosec
      - tidy
    command: .buildkite/setup-go.sh go build ./...

  - label: ":go: Build and Release"
    key: build
    depends_on:
      - test
      - build-all
      - vulncheck
    command: |
      echo "--- Building builddeck binary"
      .buildkite/setup-go.sh go build -ldflags="-s -w" -o builddeck ./cmd/builddeck
      ls -lh builddeck
      buildkite-agent artifact upload builddeck
      if [[ -n "$BUILDKITE_TAG" ]]; then
        .buildkite/release.sh
      fi
