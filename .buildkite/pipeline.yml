cache: ".buildkite/cache-volume"

steps:
  - label: ":broom: Tidy"
    key: tidy
    command: |
      .buildkite/setup-go.sh go mod tidy
      if ! git diff --exit-code -- go.mod go.sum; then
        echo "^^^ +++"
        echo "go.mod or go.sum is dirty — run 'go mod tidy' and commit the changes."
        exit 1
      fi
      echo "go.mod and go.sum are clean"

  - label: ":memo: Commit Lint"
    key: commitlint
    command: .buildkite/commitlint.sh

  - label: ":golang: Format"
    key: fmt
    depends_on: tidy
    command: .buildkite/setup-go.sh go fmt ./...

  - label: ":golang: Vet"
    key: vet
    depends_on: fmt
    command: .buildkite/setup-go.sh go vet ./...

  - label: ":female-detective: Lint"
    key: lint
    depends_on: fmt
    command: .buildkite/setup-go.sh go run github.com/golangci/golangci-lint/cmd/golangci-lint@latest run ./...

  - label: ":lock: Sec Scan"
    key: gosec
    depends_on: fmt
    command: .buildkite/setup-go.sh go run github.com/securego/gosec/v2/cmd/gosec@latest ./cmd/... ./internal/...

  - label: ":mag: Vuln Check"
    key: vulncheck
    depends_on: tidy
    command: .buildkite/setup-go.sh go run golang.org/x/vuln/cmd/govulncheck@latest ./cmd/... ./internal/...

  - label: ":golang: Test"
    key: test
    depends_on: fmt
    command: |
      echo "--- Running tests with coverage"
      .buildkite/setup-go.sh go test ./... -count=1 -coverprofile=coverage.out -v 2>&1
      echo "All tests passed"
      buildkite-agent artifact upload coverage.out

  - label: ":chart_with_upwards_trend: Codecov"
    key: codecov
    depends_on: test
    command: |
      buildkite-agent artifact download coverage.out .
      curl -sOs https://uploader.codecov.io/latest/linux/codecov
      chmod +x codecov
      ./codecov -f coverage.out

  - label: ":terminal: Snapshot + Checksum"
    key: snapshot
    depends_on:
      - vet
      - lint
      - gosec
      - vulncheck
    command: |
      echo "--- Building snapshot binary"
      .buildkite/setup-go.sh go build -ldflags="-s -w -X main.version=snapshot-${BUILDKITE_COMMIT:0:7}" -o builddeck ./cmd/builddeck
      echo "+++ Snapshot build succeeded: $(ls -lh builddeck | awk '{print $5}')"
      sha256sum builddeck
      echo "--- Snapshot done (build verification only — artifacts from release_build)"

  - label: ":bookmark: Tag"
    key: tag
    depends_on:
      - commitlint
      - test
      - snapshot
      - codecov
    branches: main
    command: |
      .buildkite/tag.sh
    secrets:
      - GITHUB_TOKEN

  - label: ":golang: Build Release Binary"
    key: release_build
    depends_on: tag
    command: |
      echo "--- Checking for release version from tag step"
      if buildkite-agent artifact download builddeck.tag . --step tag 2>/dev/null && [[ -s builddeck.tag ]]; then
        VERSION=$(cat builddeck.tag)
        echo "Version from tag step: ${VERSION}"
      else
        VERSION="dev"
        echo "No tag created, building with version: ${VERSION}"
      fi
      echo "--- Building release binary"
      .buildkite/setup-go.sh go build -ldflags="-s -w -X main.version=${VERSION}" -o builddeck ./cmd/builddeck
      echo "+++ Binary size: $(ls -lh builddeck | awk '{print $5}')"
      sha256sum builddeck | tee builddeck.sha256
      buildkite-agent artifact upload "builddeck"
      buildkite-agent artifact upload "builddeck.sha256"

  - label: ":rocket: GitHub Release"
    key: release
    depends_on: release_build
    command: |
      # Files from release_build persist on single-agent setups. Remove them first
      # so the downloads below don't fail with "file exists" on rename.
      rm -f builddeck builddeck.sha256 builddeck.tag
      if buildkite-agent artifact download builddeck.tag . --step tag 2>/dev/null && [[ -s builddeck.tag ]]; then
        VERSION=$(cat builddeck.tag)
        buildkite-agent artifact download builddeck . --step release_build
        buildkite-agent artifact download builddeck.sha256 . --step release_build
        echo "Creating GitHub release for ${VERSION}"
        .buildkite/release.sh "${VERSION}"
      else
        echo "No tag was created — skipping GitHub release"
      fi
    secrets:
      - GITHUB_TOKEN
