cache: ".buildkite/cache-volume"

steps:
  - label: ":broom: Tidy"
    key: tidy
    command: |
      .buildkite/setup-go.sh go mod tidy
      if ! git diff --exit-code -- go.mod go.sum; then
        echo "^^^ +++"
        echo "go.mod or go.sum is dirty — run 'go mod tidy' and commit the changes."
        exit 1
      fi
      echo "go.mod and go.sum are clean"

  - label: ":golang: Format"
    key: fmt
    depends_on: tidy
    command: .buildkite/setup-go.sh go fmt ./...

  - label: ":golang: Vet"
    key: vet
    depends_on: fmt
    command: .buildkite/setup-go.sh go vet ./...

  - label: ":female-detective: Lint"
    key: lint
    depends_on: fmt
    command: .buildkite/setup-go.sh go run github.com/golangci/golangci-lint/cmd/golangci-lint@latest run ./...

  - label: ":lock: Sec Scan"
    key: gosec
    depends_on: fmt
    command: .buildkite/setup-go.sh go run github.com/securego/gosec/v2/cmd/gosec@latest ./...

  - label: ":mag: Vuln Check"
    key: vulncheck
    depends_on: tidy
    command: .buildkite/setup-go.sh go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  - label: ":golang: Test"
    key: test
    depends_on: fmt
    command: |
      echo "--- Running tests with coverage"
      .buildkite/setup-go.sh go test ./... -count=1 -coverprofile=coverage.out -v 2>&1
      echo "All tests passed"
      buildkite-agent artifact upload coverage.out

  - label: ":chart_with_upwards_trend: Codecov"
    key: codecov
    depends_on: test
    command: |
      buildkite-agent artifact download coverage.out .
      curl -sOs https://uploader.codecov.io/latest/linux/codecov
      chmod +x codecov
      ./codecov -f coverage.out

  - label: ":terminal: Snapshot Build"
    key: snapshot
    depends_on:
      - vet
      - lint
      - gosec
      - vulncheck
    command: |
      echo "--- Building snapshot binary"
      .buildkite/setup-go.sh go build -ldflags="-s -w -X main.version=snapshot-${BUILDKITE_COMMIT:0:7}" -o builddeck ./cmd/builddeck
      echo "+++ Snapshot build succeeded: $(ls -lh builddeck | awk '{print $5}')"
      buildkite-agent artifact upload builddeck

  - label: ":package: Create a release?"
    key: release_unblock
    depends_on:
      - test
      - snapshot
      - codecov
    branches: main
    block: "Select release type to tag a new version"
    blocked_state: "passed"
    prompt: "Choose the semver bump for this release. Only patch and minor are available from CI; major must be done manually."
    fields:
      - key: release-type
        select: "Release Type"
        required: true
        options:
          - label: "No release — just validate"
            value: "skip"
          - label: "Patch (v0.x.X)"
            value: "patch"
          - label: "Minor (v0.X.0)"
            value: "minor"

  - label: ":bookmark: Tag"
    key: tag
    depends_on: release_unblock
    branches: main
    command: |
      RELEASE_TYPE="$(buildkite-agent meta-data get "release-type")"
      if [[ "${RELEASE_TYPE}" == "skip" ]]; then
        echo "Release skipped — no tag created"
        exit 0
      fi
      .buildkite/tag.sh "${RELEASE_TYPE}"
    secrets:
      - GITHUB_TOKEN
